name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      infisical_env:
        required: true
        type: string
        description: Infisical environment slug (staging or prod)
      image_tag:
        required: true
        type: string
        description: GHCR image tag (staging or production)
      health_url:
        required: true
        type: string
        description: Public base URL to poll for the post-deploy health gate (no trailing slash), e.g. https://staging.tavliai.com

concurrency:
  group: deploy-${{ inputs.infisical_env }}
  # Never abort a deploy that is already running. Cancelling between "image
  # pushed" and "Dokploy told to roll it out" leaves the registry ahead of the
  # running container with nothing left to reconcile them, so that commit's
  # rollout simply never happens. Queueing instead makes a burst of merges
  # deploy serially, and the last one still wins.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tavli
  INFISICAL_PROJECT_ID: da9416bf-a247-4f41-b4c0-14b22f0aaff0
  INFISICAL_API_URL: https://infisical.gggfox.com

jobs:
  deploy:
    name: Deploy ${{ inputs.infisical_env }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - run: pnpm install --frozen-lockfile

      - name: Authenticate to Infisical
        id: infisical
        env:
          INFISICAL_MACHINE_CLIENT_ID: ${{ secrets.INFISICAL_MACHINE_CLIENT_ID }}
          INFISICAL_MACHINE_CLIENT_SECRET: ${{ secrets.INFISICAL_MACHINE_CLIENT_SECRET }}
        run: |
          TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_MACHINE_CLIENT_ID" \
            --client-secret="$INFISICAL_MACHINE_CLIENT_SECRET" \
            --domain="$INFISICAL_API_URL" \
            --plain --silent)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Patch react-dom for Nitro build
        run: |
          for dir in node_modules/.pnpm/react-dom@*/node_modules/react-dom/cjs; do
            cp "$dir/react-dom-client.production.js" \
               "$dir/react-dom-client.development.js" 2>/dev/null || true
          done

      - name: Build app
        env:
          INFISICAL_TOKEN: ${{ steps.infisical.outputs.token }}
          # Baked into the bundle (Vite inlines VITE_* from the build env, same
          # as the Infisical-provided VITE_* values) so the /health route can
          # report the exact commit that is running. Matches the :<sha> image
          # tag pushed below.
          VITE_GIT_SHA: ${{ github.sha }}
        run: |
          infisical run \
            --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="${{ inputs.infisical_env }}" \
            --domain="$INFISICAL_API_URL" \
            --silent \
            -- env NODE_ENV=production VITE_GIT_SHA="$VITE_GIT_SHA" pnpm build

      - name: Deploy Convex
        env:
          INFISICAL_TOKEN: ${{ steps.infisical.outputs.token }}
        run: |
          infisical run \
            --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="${{ inputs.infisical_env }}" \
            --domain="$INFISICAL_API_URL" \
            --silent \
            -- npx convex deploy --yes

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Pins the Dokploy application to the immutable :<sha> reference pushed
      # above, then deploys it. The old webhook only said "redeploy" and left
      # the image choice to Dokploy's stored config — a mutable :staging /
      # :production tag that Docker can serve from its local cache, which is
      # how both environments ran a 2026-07-19 build for a week with every
      # workflow step green. See dokploy-rollout.sh for the fallback path.
      - name: Roll out to Dokploy
        env:
          INFISICAL_TOKEN: ${{ steps.infisical.outputs.token }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          DEPLOY_TITLE: ${{ inputs.infisical_env }} @ ${{ github.sha }}
        run: |
          infisical run \
            --token="$INFISICAL_TOKEN" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="${{ inputs.infisical_env }}" \
            --domain="$INFISICAL_API_URL" \
            --silent \
            -- bash .github/scripts/dokploy-rollout.sh

      # Accepting a rollout is not serving it. Poll /health until the deployed
      # env reports the SHA we just built, so a rollout that silently did
      # nothing fails the job instead of going unnoticed — the class behind both
      # the 4-day staging outage and the week-long stale-rollout incident. The
      # script classifies *how* it failed, because "serving an old build" and
      # "serving nothing" have different remediations.
      - name: Post-deploy health gate
        env:
          HEALTH_BASE_URL: ${{ inputs.health_url }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: bash .github/scripts/health-gate.sh

      # No new secrets: uses the built-in GITHUB_TOKEN. Opens (or comments on an
      # existing) issue labeled deploy-failure so a red deploy is a visible,
      # trackable signal. GitHub additionally emails the actor who triggered the
      # run on failure. Runs on ANY prior step failure, incl. the health gate.
      - name: Alert on deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: ${{ inputs.infisical_env }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          HEALTH_BASE_URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          TITLE="Deploy failed: ${ENV_NAME}"

          # Ask the environment what it is actually serving and put the answer in
          # the alert. Eight identical "deploy failed" comments accumulated on one
          # issue during the 2026-07 stale-rollout incident precisely because the
          # alert said nothing that distinguished them.
          HEALTH_URL="${HEALTH_BASE_URL%/}/health"
          HTTP_CODE=$(curl -sS --max-time 10 -o /tmp/health-body -w '%{http_code}' "$HEALTH_URL") || HTTP_CODE=000
          SERVING=$(jq -r '.sha // empty' /tmp/health-body 2>/dev/null || true)
          if [ "$HTTP_CODE" = "000" ]; then
            STATE=$(printf 'nothing — %s is not answering. No healthy container; check Dokploy -> app -> Logs.' "$HEALTH_URL")
          elif [ "$SERVING" = "$COMMIT_SHA" ]; then
            STATE=$(printf 'the expected commit. The rollout may have landed just after the gate timed out — verify and close.')
          elif [ -n "$SERVING" ]; then
            STATE=$(printf '`%s`, but this run built `%s`. **The rollout did not replace the container.** Check Dokploy -> app -> Deployments, and confirm the app image is the immutable `:<sha>` reference rather than a mutable `:staging` / `:production` tag.' "$SERVING" "$COMMIT_SHA")
          else
            STATE=$(printf 'HTTP %s with no sha. The build may predate the /health route, or something other than the app is answering.' "$HTTP_CODE")
          fi

          BODY=$(printf 'Deploy to **%s** failed.\n\n- Run: %s\n- Commit: %s\n- Workflow: %s\n\n**%s is serving:** %s\n\nA step failed (build, Convex deploy, image push, Dokploy rollout, or the post-deploy health gate). Open the run and read the **Deploy diagnosis** group in the health-gate step — it names the failure class and its fix. Close this issue once the environment serves the expected commit.' "$ENV_NAME" "$RUN_URL" "$COMMIT_SHA" "$GITHUB_WORKFLOW" "$HEALTH_BASE_URL" "$STATE")
          # Ensure the label exists (no-op if it already does).
          gh label create deploy-failure --color B60205 --description "Automated deploy failure alert" 2>/dev/null || true
          # Reuse the open alert for this environment if one exists, else open one.
          NUMBER=$(gh issue list --label deploy-failure --state open --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
            echo "Commented on existing deploy-failure issue #$NUMBER"
          else
            gh issue create --title "$TITLE" --label deploy-failure --body "$BODY"
            echo "Opened a new deploy-failure issue for $ENV_NAME"
          fi
